[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unattended-mode-utils"
version = "0.1.0"
description = "Reusable unattended-mode utilities for Python scripts."
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Aaron Rusz"}]
license = {text = "GPL-3.0-or-later"}
[project.optional-dependencies]
test = ["pytest"]
keywords = ["unattended", "daemon", "logging", "python"]
